name: evals (reusable)
on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version to run under
        type: string
        default: "22"
      root:
        description: Instance root directory to run evals in
        type: string
        default: "."
      team-ai-version:
        description: team-ai version to run via npx
        type: string
        default: "latest"
permissions:
  contents: read
jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
      - run: npx team-ai@${{ inputs.team-ai-version }} run-evals --root ${{ inputs.root }} --json | tee eval-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: eval-report.json
